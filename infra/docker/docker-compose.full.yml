# Full stack — runs ALL apps + the agent orchestrator together.
# Usage (from repo root):
#   docker compose -f infra/docker/docker-compose.full.yml up --build
#
# Note: ticketflow, employee-self-service, and agent-orchestrator are scaffolds
# for the coming weeks. globalcart is fully implemented today.
services:
  globalcart-backend:
    build: ../../apps/globalcart/backend
    container_name: globalcart-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  globalcart-frontend:
    build: ../../apps/globalcart/frontend
    container_name: globalcart-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://globalcart-backend:8000
    depends_on:
      - globalcart-backend
    restart: unless-stopped

